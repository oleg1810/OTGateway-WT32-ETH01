[env:s3_mini_n16r8_ble_forcewifi]
platform = ${esp32_defaults.platform}
platform_packages = ${esp32_defaults.platform_packages}
board = esp32-s3-devkitc-1
board_build.partitions = ${esp32_defaults.board_build.partitions}
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps = 
	${esp32_defaults.lib_deps}
	${esp32_defaults.nimble_lib}
lib_ignore = ${esp32_defaults.lib_ignore}
extra_scripts = ${esp32_defaults.extra_scripts}
build_unflags =
	-DARDUINO_USB_MODE=1
build_type = ${esp32_defaults.build_type}
build_flags = 
	${esp32_defaults.build_flags}
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D USE_BLE=1
	-D FORCE_WIFI_PS_NONE=1
	-D DEFAULT_OT_IN_GPIO=4
	-D DEFAULT_OT_OUT_GPIO=5
	-D DEFAULT_SENSOR_OUTDOOR_GPIO=6
	-D DEFAULT_SENSOR_INDOOR_GPIO=7
	-D DEFAULT_STATUS_LED_GPIO=8
	-D DEFAULT_OT_RX_LED_GPIO=9
check_tool = ${esp32_defaults.check_tool}
check_flags = ${esp32_defaults.check_flags}
